<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seto Glass &amp; Pottery: A Private Day with Master Artisans | Balt Kobo</title>
<meta name="description" content="A private day in Seto, Japan's 1,000-year pottery town. Blow glass and throw pottery with master artisans, see the clay mine and a climbing kiln, and take home four handmade pieces. One group a day, 2–4 guests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --kaolin:#EFEEEA; --kaolin-2:#E4E2DC; --ash:#2E2B28; --ash-soft:#5C5853;
  --iron:#6B4A2E; --glass:#2C6E7A; --ochre:#C9A23A; --line:#CFCCC4; --line-dark:#4A4642;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --wrap:1180px; --sky:#CFE0E3; --sky-ink:#2E2B28;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--kaolin);color:var(--ash);font-family:var(--sans);font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--glass)}
:focus-visible{outline:2px solid var(--glass);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.3;margin:0}
h2{font-size:clamp(28px,3.4vw,44px);margin-bottom:20px}
p{margin:0 0 1em}
section{padding:96px 0}
.alt{background:var(--kaolin-2)}
.dark{background:var(--ash);color:var(--kaolin)}
.dark p,.dark li{color:#D8D5CE}
.intro{max-width:42em;color:var(--ash-soft);margin-bottom:48px}
.dark .intro{color:#B9B5AD}
@media (max-width:760px){section{padding:72px 0}}

/* Header */
.site-head{position:sticky;top:0;z-index:50;background:rgba(239,238,234,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.site-head .wrap{display:flex;align-items:center;gap:24px;height:68px}
.brand{text-decoration:none;color:var(--ash);display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--serif);font-size:20px;font-weight:800;letter-spacing:.04em}
.brand small{font-size:11px;color:var(--ash-soft);letter-spacing:.04em}
.nav{display:flex;gap:22px;margin-left:auto}
.nav a{color:var(--ash);text-decoration:none;font-size:14px}
.nav a:hover{color:var(--glass)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{font:inherit;font-size:12px;background:none;border:0;padding:6px 10px;cursor:pointer;color:var(--ash-soft)}
.langs button[aria-pressed="true"]{background:var(--ash);color:var(--kaolin)}
.btn{display:inline-block;font-family:var(--sans);font-weight:700;text-decoration:none;background:var(--glass);color:#fff;padding:15px 28px;border-radius:2px;font-size:16px;transition:background .2s;border:0;cursor:pointer}
.btn:hover{background:#21555E}
.btn.small{padding:9px 16px;font-size:13px}
.micro{font-size:13px;color:var(--ash-soft);margin-top:10px}
@media (max-width:1020px){.nav{display:none}.langs{margin-left:auto}}
@media (max-width:520px){.site-head .btn.small{display:none}}

/* Photo slots */
.photo{position:relative;overflow:hidden;background:var(--kaolin-2);border-radius:2px}
.photo>span{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--ash-soft)}
.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.tone-glass{background:linear-gradient(160deg,#3B7F8A,#1F4E57)}
.tone-clay{background:linear-gradient(160deg,#D9D3C7,#B8AE9C)}
.tone-fire{background:linear-gradient(160deg,#B8693A,#5A3221)}
.tone-dusk{background:linear-gradient(160deg,#6E4A44,#2C3448)}
.tone-glass>span,.tone-fire>span,.tone-dusk>span{color:rgba(255,255,255,.7)}

/* Hero */
.hero{padding:40px 0 80px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:start}
.kicker{font-size:15px;color:var(--glass);font-weight:700;margin-bottom:18px}
.hero h1{font-size:clamp(38px,5vw,68px);font-weight:800;line-height:1.12}
html[lang="ja"] .hero h1{font-size:clamp(32px,4.6vw,62px);line-height:1.35;letter-spacing:.02em}
html[lang="fr"] .hero h1,html[lang="de"] .hero h1{font-size:clamp(34px,4.4vw,60px)}
.hero .lead{font-size:18px;max-width:34em;margin:24px 0 28px;color:var(--ash-soft)}
.facts{list-style:none;margin:0 0 32px;padding:0;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.facts li{padding:13px 16px 13px 0;border-bottom:1px solid var(--line);font-size:15px}
.facts li:first-child{font-family:var(--serif);font-size:22px;font-weight:700}
.rating{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:14px;color:var(--ash-soft)}
.stars{color:var(--ochre);letter-spacing:2px;font-size:16px}
.hero-photos{display:grid;gap:12px}
.hero .photo{aspect-ratio:3/2}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:28px}.hero-photos{order:-1;grid-template-columns:1fr 1fr;gap:8px}.hero .photo{aspect-ratio:1/1}.facts{grid-template-columns:1fr}}

/* Empathy */
.empathy .wrap{display:grid;grid-template-columns:6fr 5fr;gap:64px;align-items:start}
.empathy h2{font-size:clamp(28px,3.2vw,42px);margin:0}
.empathy p{color:var(--ash-soft);font-size:18px}
@media (max-width:860px){.empathy .wrap{grid-template-columns:1fr;gap:24px}}

/* Story */
.story .wrap{display:grid;grid-template-columns:5fr 7fr;gap:64px}
.story p{max-width:38em;line-height:1.9}
.story p:last-child{font-family:var(--serif);font-size:20px;color:var(--kaolin);line-height:1.7;margin-top:28px}
.eras{list-style:none;margin:8px 0 32px;padding:0 0 0 22px;border-left:1px solid #6E6A64}
.eras li{position:relative;padding:0 0 18px}
.eras li::before{content:"";position:absolute;left:-27px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--ochre)}
.eras b{display:block;font-family:var(--serif);font-size:15px;color:var(--ochre);font-weight:700;line-height:1.5}
.eras span{display:block;color:#D8D5CE;font-size:15px;line-height:1.75}
.land{grid-column:1/-1;margin:40px 0 0;display:grid;grid-template-columns:2fr 1fr;gap:16px}
.land figure{margin:0}
.land .photo{aspect-ratio:auto;height:clamp(280px,36vw,460px)}
.land figcaption{font-size:14px;color:#B9B5AD;margin-top:12px}
@media (max-width:760px){.land{grid-template-columns:1fr}.land .photo{height:auto;aspect-ratio:4/3}}
.chain{list-style:none;padding:0;margin:56px 0 0;display:grid;grid-template-columns:repeat(5,1fr);position:relative;grid-column:1/-1}
.chain::before{content:"";position:absolute;left:10%;right:10%;top:9px;height:1px;background:#6E6A64}
.chain li{text-align:center;position:relative;font-family:var(--serif);font-size:17px;color:var(--kaolin)}
.chain li::before{content:"";display:block;width:19px;height:19px;border-radius:50%;margin:0 auto 14px;background:var(--ash);border:1px solid #9A958D}
.chain li:first-child::before{background:var(--ochre);border-color:var(--ochre)}
.chain li:last-child::before{background:var(--kaolin);border-color:var(--kaolin)}
@media (max-width:860px){.story .wrap{grid-template-columns:1fr;gap:20px}.chain li{font-size:13px}}

/* Video */
.video-box{position:relative;aspect-ratio:16/9;background:#000;border-radius:2px;overflow:hidden}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Expect / Why */
.ew{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.ew h2{font-size:clamp(24px,2.6vw,34px);padding-bottom:14px;border-bottom:2px solid var(--glass);margin-bottom:8px}
.ew .why h2{border-color:var(--iron)}
.ew ul{list-style:none;margin:0;padding:0}
.ew li{padding:18px 0;border-bottom:1px solid var(--line)}
.ew li b{display:block;font-family:var(--serif);font-size:21px;line-height:1.4;margin-bottom:4px}
.ew li span{color:var(--ash-soft);font-size:15px}
@media (max-width:860px){.ew{grid-template-columns:1fr;gap:48px}}

/* Day */
.day-grid{display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:start}
.sky{position:sticky;top:96px;height:min(calc(100vh - 140px),620px);border-radius:2px;background:var(--sky);color:var(--sky-ink);overflow:hidden;transition:background 1.1s ease,color 1.1s ease}
.sky .horizon{position:absolute;left:0;right:0;bottom:30%;height:1px;background:currentColor;opacity:.35}
.sky .ground{position:absolute;left:0;right:0;bottom:0;height:30%;background:currentColor;opacity:.07}
.sky .orb{position:absolute;width:64px;height:64px;border-radius:50%;left:var(--ox,15%);bottom:var(--oy,40%);transform:translate(-50%,50%);background:var(--orb,#F3E3B5);box-shadow:0 0 60px 10px var(--orb-glow,rgba(243,227,181,.55));transition:left 1.1s ease,bottom 1.1s ease,background 1.1s ease,box-shadow 1.1s ease}
.sky .clock{position:absolute;left:32px;top:28px;font-family:var(--serif);font-weight:800;font-size:clamp(48px,6vw,88px);line-height:1;font-variant-numeric:tabular-nums}
.sky .now{position:absolute;left:32px;right:32px;bottom:28px;font-family:var(--serif);font-size:20px;line-height:1.4}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:72px 1fr;gap:20px;padding:34px 0;border-top:1px solid var(--line)}
.stop:last-child{border-bottom:1px solid var(--line)}
.stop time{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ash-soft);padding-top:2px}
.stop.is-active time{color:var(--glass)}
.stop h3{font-size:23px;margin-bottom:8px}
.stop p{color:var(--ash-soft);margin:0}
.stop .photo{aspect-ratio:3/2;margin-top:18px}
@media (max-width:860px){
  .day-grid{grid-template-columns:1fr;gap:0}
  .sky{top:calc(68px + env(safe-area-inset-top,0px));height:84px;z-index:5;margin:0 -24px}
  .sky .clock{font-size:34px;top:50%;transform:translateY(-50%);left:24px}
  .sky .now{left:132px;right:96px;bottom:auto;top:50%;transform:translateY(-50%);font-size:15px}
  .sky .orb{width:34px;height:34px;left:auto;right:28px;bottom:50%;transform:translateY(50%)}
  .sky .horizon,.sky .ground{display:none}
  .stop{grid-template-columns:56px 1fr;gap:14px}.stop h3{font-size:20px}
}

/* Take home */
.sub{font-size:22px;margin:0 0 6px}
.subp{color:var(--ash-soft);margin:0 0 18px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 0 48px;list-style:none;padding:0}
.gal li .photo{aspect-ratio:1/1}
.gal li p{font-family:var(--serif);font-size:16px;margin:12px 0 0}
@media (max-width:860px){.gal{grid-template-columns:1fr 1fr;gap:8px}.gal li p{font-size:13px}}
.ba{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0 48px;list-style:none;padding:0}
.ba li .photo{aspect-ratio:1/1}
.ba li p{font-family:var(--serif);font-size:16px;margin:12px 0 0}
.take-grid{display:grid;grid-template-columns:7fr 5fr;gap:56px;align-items:start}
.take-item{padding:20px 0;border-top:1px solid var(--line)}
.take-item h3{font-size:21px;margin-bottom:6px}
.take-item p{color:var(--ash-soft);margin:0}
.note{font-size:14px;color:var(--ash-soft);border-left:3px solid var(--ochre);padding-left:14px;margin-top:24px}
.take-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.take-grid .photo{aspect-ratio:4/5}
@media (max-width:860px){.take-grid{grid-template-columns:1fr}.ba{gap:8px}.ba li p{font-size:13px}}

/* People */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.person .photo{aspect-ratio:4/5;margin-bottom:20px}
.person .photo img{object-position:center 20%}
.team{margin:56px 0 0}
.team .photo{aspect-ratio:16/9}
.team .photo img{object-position:center 35%}
@media (max-width:760px){.team .photo{aspect-ratio:4/3}}
.team figcaption{font-size:14px;color:var(--ash-soft);margin-top:12px}
.person h3{font-size:26px}
.person .role{font-size:14px;color:var(--ash-soft);margin:4px 0 10px}
.person .years{font-family:var(--serif);font-weight:700;color:var(--iron);margin-bottom:10px}
.person p{color:var(--ash-soft);font-size:15px}
.person blockquote{margin:16px 0 0;padding-left:14px;border-left:2px solid var(--glass);font-family:var(--serif);font-size:16px}
@media (max-width:860px){.people{grid-template-columns:1fr}.person .photo{aspect-ratio:4/3}}

/* Reviews */
.reviews{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.review{background:#fff;padding:16px;border-radius:2px;border:1px solid var(--line)}
.review img{width:100%;height:auto}
.review .tr{margin:14px 4px 4px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--ash-soft)}
.review .tr small{display:block;font-size:12px;color:var(--glass);font-weight:700;margin-bottom:4px}
.review p{margin:10px 0 14px}
.review small{color:var(--ash-soft);font-size:13px}
.review-links{margin-top:28px;display:flex;flex-wrap:wrap;gap:24px;font-size:15px}
@media (max-width:900px){.reviews{grid-template-columns:1fr}}

/* Price */
.price-grid{display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:start}
.price-card{background:var(--ash);color:var(--kaolin);padding:40px;border-radius:2px}
.price-card .amount{font-family:var(--serif);font-size:56px;font-weight:800;line-height:1}
.price-card .per{color:#B9B5AD;margin:8px 0 24px}
.price-card dl{margin:0 0 28px}
.price-card dt{font-size:13px;color:#A9A49C;margin-top:14px}
.price-card dd{margin:2px 0 0;font-size:15px}
.price-card .micro{color:#B9B5AD}
.offer{margin-top:20px;padding:16px;border:1px solid var(--ochre);color:var(--kaolin)}
.offer b{display:block;font-family:var(--serif);font-size:18px;color:var(--ochre)}
.inc h3{font-size:20px;margin:0 0 10px}
.inc ul{margin:0 0 32px;padding-left:1.2em;color:var(--ash-soft)}
.inc li{margin:4px 0}
@media (max-width:860px){.price-grid{grid-template-columns:1fr}}

/* Worries */
.worries{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.worry{padding:24px 0;border-top:1px solid var(--line)}
.worry h3{font-size:22px;margin-bottom:8px}
.worry p{color:var(--ash-soft);margin:0}
@media (max-width:760px){.worries{grid-template-columns:1fr}}

/* Steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:40px 32px;counter-reset:s}
.steps li{counter-increment:s;padding-top:18px;border-top:2px solid var(--glass)}
.steps li::before{content:counter(s);font-family:var(--serif);font-weight:800;font-size:28px;color:var(--glass);display:block;line-height:1;margin-bottom:10px}
.steps h3{font-size:20px;margin-bottom:6px}
.steps p{color:var(--ash-soft);margin:0;font-size:15px}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* Know + cancel */
.know-grid{display:grid;grid-template-columns:7fr 5fr;gap:64px}
.know ul{margin:0;padding:0;list-style:none}
.know li{padding:14px 0 14px 22px;border-top:1px solid var(--line-dark);position:relative;font-size:15px}
.know li::before{content:"";position:absolute;left:2px;top:24px;width:8px;height:8px;border-radius:50%;background:var(--ochre)}
.cancel h3{font-size:22px;margin-bottom:16px}
.cancel ul{list-style:none;margin:0;padding:0}
.cancel li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line-dark);font-size:15px}
.know .cancel li{padding-left:0}
.know .cancel li::before{content:none}
.cancel li b{font-family:var(--serif);font-size:18px;white-space:nowrap;color:var(--kaolin)}
@media (max-width:860px){.know-grid{grid-template-columns:1fr;gap:48px}}

/* FAQ */
.faq details{border-top:1px solid var(--line);max-width:860px}
.faq details:last-of-type{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 40px 20px 0;font-family:var(--serif);font-size:19px;font-weight:700;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:16px;font-size:26px;font-family:var(--sans);font-weight:400;color:var(--glass)}
.faq details[open] summary::after{content:"−"}
.faq details p{color:var(--ash-soft);padding-bottom:20px;margin:0;max-width:44em}

/* Book */
.book{background:var(--glass);color:#fff}
.book .head{text-align:center;max-width:40em;margin:0 auto 36px}
.book .head p{color:#DCEAEC}
.book .micro{color:#DCEAEC}
.form-frame{max-width:760px;margin:0 auto;background:#fff;border-radius:2px;overflow:hidden}
.form-frame iframe{display:block;width:100%;height:1500px;border:0}
.form-fallback{text-align:center}
.form-fallback .btn{background:var(--kaolin);color:var(--ash)}
.form-fallback .btn:hover{background:#fff}
.book .after{text-align:center;font-size:14px;color:#DCEAEC;margin-top:20px}

/* Footer */
footer{background:var(--ash);color:#B9B5AD;font-size:14px;padding:56px 0 calc(40px + env(safe-area-inset-bottom,0px))}
footer a{color:var(--kaolin)}
.foot-grid{display:grid;grid-template-columns:7fr 5fr;gap:48px}
.orgs{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media (max-width:760px){.orgs{grid-template-columns:1fr;gap:24px}}
footer h3{font-size:16px;color:var(--kaolin);margin-bottom:10px}
footer p{margin:0 0 8px}
footer details summary{cursor:pointer;color:var(--kaolin);margin-bottom:8px}
footer .links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px}
footer .copy{margin-top:40px;font-size:12px}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr}}

/* Mobile CTA */
.mbar{display:none}
@media (max-width:520px){
  .mbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(239,238,234,.96);border-top:1px solid var(--line);transition:transform .3s}
  .mbar .btn{display:block;text-align:center}
  .mbar.hide{transform:translateY(110%)}
  footer{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

/* FAQ chatbot */
.bot-btn{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;width:58px;height:58px;border-radius:50%;border:0;background:var(--glass);color:#fff;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.bot-btn:hover{background:#21555E}
.bot-btn svg{width:26px;height:26px}
.bot{position:fixed;right:24px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:71;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100vh - 140px));background:#fff;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.bot[hidden]{display:none}
.bot-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ash);color:var(--kaolin)}
.bot-head b{font-family:var(--serif);font-size:16px}
.bot-head button{background:none;border:0;color:var(--kaolin);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.bot-log{flex:1;overflow-y:auto;padding:16px;position:relative;display:flex;flex-direction:column;gap:10px;background:var(--kaolin)}
.msg{max-width:85%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.6}
.msg.b{background:#fff;color:var(--ash);border-top-left-radius:3px;align-self:flex-start}
.msg.u{background:var(--glass);color:#fff;border-top-right-radius:3px;align-self:flex-end}
.msg .btn{margin-top:10px;padding:9px 14px;font-size:13px}
.bot-chips{max-height:34%;overflow-y:auto;padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;background:#fff}

  emp:{h:"多くの工芸体験は、見知らぬ人と並ぶ1時間の教室です。",
    p:["急いで形をつくり、仕上げは誰かが行う。その技に人生を捧げてきた本人と、ゆっくり話すことはほとんどありません。",
       "この一日は、その反対です。参加するのはあなたのグループだけ。各工程では、その道の匠本人が今も動く工房で指導・案内し、夜の夕食会には匠たちが顔をそろえます。"]},
  story:{h:"「せともの」の名が生まれた町",
    p:["日本では今も、日常の焼き物を「せともの」と呼びます。その名のもとになった瀬戸は、千年以上、途切れることなく焼き物をつくり続けてきた町です。", "すべての始まりは土でした。日本列島ができるよりも前、この一帯は湖や湿地のくぼ地でした。そこに流れ込んだ花崗岩から長い年月をかけて鉄分が抜け、世界でも珍しい白い粘土が生まれました。この白い土からは、陶器も磁器もつくれます。同じ大地からはガラスの原料となる珪砂も採れ、国内で採れる珪砂の約7割が瀬戸産とも言われます。粘土の鉱山は、尾張瀬戸駅から歩いて10分ほどの場所に広がっています。", "鉄道を敷くほど栄えた焼き物の町も、今はその営みが少しずつ細くなっています。愛知県陶磁器工業協同組合の組合員は、かつての1,000社超から約250社に。今掘られている粘土も、あと25年ほどで採り尽くされるとも言われています。それでも瀬戸には、土を掘る人から、精製し、形にし、焼き、届ける人まで、焼き物づくりの全工程が今も一つの町にそろっています。器一つにも、原型師、型屋、素地屋、釉薬屋、絵付師、窯元、問屋と多くの専門家が関わり、町全体がひとつの工場のように動いてきました。", "この一日に協力する匠たちの想いは、ひとつです。今も息づくこの技を世界の人に見てもらい、そのかけらを持ち帰ってほしい。"],
    eras:[["平安時代末期（約1000年前）", "赤松の灰を使った釉薬で、焼き物づくりが始まったと言われています。"], ["戦国〜江戸時代", "茶の湯とともに焼き物が栄え、江戸時代には名古屋城の主・尾張徳川家の器も焼かれました。"], ["江戸時代末期", "地元の白い土から、磁器づくりが始まります。"], ["明治〜昭和", "コーヒーカップや陶磁器の人形が世界へ輸出され、陶工・河本益吉の2代目が、瀬戸電気鉄道（現在の名鉄瀬戸線）を開業。瀬戸物は鉄道で名古屋へ運ばれ、堀川を通って名古屋港へ、そこから日本全国、そして世界へと渡っていきました。町は大いに栄え、「せともの」は焼き物の代名詞になりました。"], ["1982年", "窯も耐火れんがも、相談できる職人もそろう焼き物の町だからこそ、愛知県初の個人ガラス工房「バルト工房」が誕生しました。"]],

  day:{h:"一日の流れ",intro:"すべて貸切です。移動は専用車、現地のご案内は英語で行います。",stops:[
    ["10:00","尾張瀬戸駅に集合","駅でお迎えします。スタッフが一日同行し、写真と動画を撮影します。"],
    ["10:15","ガラス職人との対話","ガラス歴45年以上の{M}は、1982年に愛知県初の個人ガラス工房としてバルト工房を開きました。焼き物の町がなぜガラスの町にもなったのか、足元の砂の話から語ります。"],
    ["10:30","ガラス作品を2点","工房の炉とバーナーを使い、マンツーマンの指導で2点を制作します。グラス・一輪挿し・風鈴は吹きガラスで、ペンダントトップはバーナーで溶かしてつくるランプワークで。色も柄も自分で選ぶので、世界に一つだけの作品になります。匠の奥様、または工房のスタッフが体験をサポートし、始める前には安全説明があります。","glass.jpg","fire"],
    ["12:00","職人と昼食","瀬戸のソウルフード「瀬戸焼きそば」を、工房の手づくりで。蒸し麺をしょうゆベースの豚の煮汁で仕上げる、職人たちが昔から食べてきた味で、文化庁の「100年フード」にも選ばれています。"],
    ["13:00","粘土鉱山を車窓から、製陶所へ","出発前に、これから巡る場所を写真でご説明します。国道沿いから瀬戸焼の原点である粘土鉱山地帯を眺め、大正元年創業の老舗窯元「竹堂園」へ。職人による絵付けの作業を間近で見学します。","chikudoen.jpg","clay"],
    ["14:00","現存する登り窯","瀬戸本業窯8代目の{Z}が、瀬戸民藝館と現存する登り窯を案内します。柳宗悦やバーナード・リーチが称えた日用の器から、町の歴史を学びます。","kiln.jpg","clay"],
    ["15:00","ろくろで2点","静かなギャラリー兼工房「陶酔」で、陶芸歴50年以上の{K}の指導のもと、湯呑み、お皿、茶碗、小鉢から2点をつくります。","pottery.jpg","clay"],
    ["17:00","作家・職人と囲む特別夕食会","この日出会った作家・職人たちと、瀬戸の郷土料理を囲みます。作業台では聞けなかったことを、ゆっくり話せる時間です。","dinner.jpg","dusk"],

  take:{h:"持ち帰るもの",intro:"自分の手でつくる4つの作品。どれも世界に一つだけです。",
    gH:"ガラス作品：2点",gP:"ペンダントトップ（ランプワーク）、グラス・一輪挿し・風鈴（吹きガラス）から2点。色も柄も自分で選ぶので、本当に世界に一つだけの作品です。",g:["革ひも付きのペンダントトップ", "グラス", "一輪挿し", "色も柄も自分で選べます"],bH:"陶芸作品：2点（土から桐箱まで）",
    ba:["鉱山から生まれた瀬戸の土","ろくろで形にした器","焼き上げ、桐箱に収めた完成品"],
    items:[["当日：ペンダントトップ","ペンダントトップを選んだ方は、革ひもを付けてその日のうちにお渡しします。"],
      ["約2か月後：そのほかの作品","陶芸作品は乾燥と2度の焼成に約2か月かかります。焼き上がった器とガラス作品は、匠の銘（サインと落款）入りの高級桐箱（側面には書道家による書）に作品証明を添えて収め、EMSで発送します。"],
      ["海を越えるための梱包","すべての箱を手作業で丁寧に梱包します。これまでの国際発送で、作品が破損したことは一度もありません。"]],
    note:"送料は当日、現金（日本円）でお支払いいただきます。料金は段ボール1箱ごとに、重さと発送先で決まります。お一人分の作品はすべて桐箱1つに収まり、単独で送る場合は約5kgの1箱で、EMSで約9,000〜18,000円が目安です。同じ住所への発送なら、2人分の桐箱を段ボール1箱にまとめられます（3〜4人分の場合は2箱になることがあります）。発送先は何か所でも指定できます。"},
  people:{h:"あなたを迎える匠たち",intro:"各工程は、その道の匠が担当して指導・案内します。夜の夕食会には、匠たちが顔をそろえます。",team:"{M}（左から2人目）と、ふだん吹きガラスのサポートと昼食づくりを担う奥様（右端）。参加者のみなさんと。",list:[["M", "ガラス工芸家／バルト工房 主宰", "ガラス歴45年以上", "1982年に瀬戸市でバルト工房を開設して以来、40年以上にわたりガラス制作と体験指導を続けてきました。年間3,000名を超える来訪者に吹きガラスやランプワークを教え、「なるべくお客様自身の手でつくってもらう」スタイルは、海外のゲストからも高く評価されています。1988年から約2年間は英国でガラスを学び、帰国後は仲間と研究会を立ち上げたり、展覧会やイベントを開いたりして、瀬戸にガラス文化の種をまいてきました。日本のガラスアートの草創期を知る一人で、瀬戸の陶芸家や窯元とも深い信頼関係を築いています。この一日のホストとして、ガラスと焼き物の両方の現場をご案内します。", "lee.jpg"], ["K", "陶芸家／陶酔・瀬戸陶芸協会 功労会員", "陶芸歴50年以上", "1974年に日展入選。中日国際陶芸展 準大賞（1983年）、国際陶磁器展美濃 銅賞（1989年）、伊丹クラフト展 金賞（1991年）など受賞多数。イタリアのファエンツァ国際陶芸展にも招待出品しています。現在は工房「陶酔」で作品づくりと陶芸教室を続けながら、創立130年の瀬戸窯業高校（現・瀬戸工科高校）の同窓会長として、在校生の指導も務めています。初心者にも根気強く、励ましながら教えてくれると評判です。", "kamei.jpg"], ["Z", "瀬戸本業窯 八代目後継者", "8代続く窯元の後継者", "1979年、瀬戸本業窯に生まれる。代々「水野半次郎」の名を受け継ぐ家の八代目後継者として、父である七代半次郎に師事。日本民藝館展で奨励賞を2度受賞（2013年・2017年）し、全国の民藝館や美術館で講演も務めています。2022年に「瀬戸・ものづくりと暮らしのミュージアム（瀬戸民藝館）」を開館。瀬戸の歴史の語り部として、民藝館と登り窯を案内します。", "mizuno.jpg"]]},
  reviews:{h:"参加者の声",intro:"海外大手旅行予約サイトに寄せられた、吹きガラス体験と陶芸体験のレビューです。この一日ツアーは、その2つをひとつにした新しい体験です。",label:"日本語訳",tr:["素晴らしい体験でした！私たち2人だけで、匠とそのチームと過ごせました。次のホテルへの配送も完璧で、グラスは割れずに届きました。自分たちでこんなに多くのことをやらせてもらえるなんて驚きです。本当に最高でした！","瀬戸の人々が陶芸の伝統を守り、伝えている様子を見られて、素晴らしい体験でした。歴史をわかりやすく説明してくれ、ろくろでさまざまな作品のつくり方を教えてくれました。陶芸やこの美しい芸術に興味がある人に、心からおすすめします！","とても素敵な陶芸体験でした。落ち着いた雰囲気で、ガイドのYasuさんと先生は最高でした。根気強く、説明がわかりやすく、たくさん励ましてくれました。初心者でも、すべての工程を簡単に楽しめました。本当におすすめです！","瀬戸の陶芸家ご夫妻に教わりながら、実際にろくろを体験できて最高でした。作品がとても気に入ったので、追加料金を払って全部持ち帰ることにしました。1〜2か月待ちますが問題ありません。先生方のオリジナル作品も購入でき、作品が並ぶお店やギャラリーも訪れました。本当に素晴らしい体験でした！"],

  bot:{"title": "ツアーについてのご質問", "hello": "こんにちは。下の質問を押すと、すぐにお答えします。", "extra": [["料金はいくらですか？", "1名66,000円（税込）、2〜4名の完全貸切です。作品のEMS送料は別途、当日現金でお支払いいただきます。"], ["いつ参加できますか？", "平日のみ、10:00〜19:00、1日1組です。土日祝日（GW〈4月末〜5月初め〉を含む）と、お盆（8月中旬）、年末年始（12月末〜1月初め）は除きます。お申し込みはツアー日の20日前までです。"]], "other": "ほかの質問をしたい", "otherA": "予約フォームで「質問のみ」を選んでお送りください。3営業日以内にメールでお答えします。", "book": "予約フォームへ", "more": "ほかに知りたいことはありますか？", "open": "質問チャットを開く", "close": "閉じる"},
  faq:{h:"よくある質問",items:[
    ["経験がなくても参加できますか？","はい。各工程の匠がマンツーマンで指導し、最後まで仕上げを支えます。"],
    ["吹きガラスは安全ですか？","火や高温のガラス、工具を扱うため、開始前に安全説明と同意書へのご署名をお願いしています。保険にも加入しています。つま先の覆われた靴と、綿などの天然素材の服でお越しください。"],
    ["子どもも参加できますか？","6歳から、作業台に安全に届く身長があれば参加でき、料金は大人と同じです。6歳未満のお子様は体験に参加できませんが、同行は無料です。"],
    ["送料はいくらですか？","送料は段ボール1箱ごとに、重さと発送先で決まり、当日現金でお支払いいただきます。お一人分の作品はすべて桐箱1つに収まり、単独で送る場合は約5kgの1箱で、EMSで約9,000〜18,000円が目安です。同じ住所への発送なら、2人分の桐箱を段ボール1箱にまとめられます（3〜4人分の場合は2箱になることがあります）。発送先は何か所でも指定できます。"],
    ["作品はいつ届きますか？","陶芸作品は乾燥と2度の焼成に約2か月かかり、その後EMSで発送します。ペンダントトップは当日お持ち帰りいただけます。"],
    ["写真は撮れますか？","もちろんです。同行スタッフも一日の様子を写真と動画で撮影し、WhatsAppでお送りします。"],
    ["雨の日はどうなりますか？","雨天でも催行します。移動は専用車です。"],
    ["尾張瀬戸駅へはどう行けばいいですか？","名古屋の中心部・栄町駅から名鉄瀬戸線に乗り、終点の尾張瀬戸駅で下車します。名古屋駅からは約40分です。この路線は、もともと瀬戸の焼き物を運ぶために開業した鉄道です。"],
    ["ホテルまで送迎してもらえますか？","ホテル送迎はありません。行程中の移動は専用車でご案内します。"],
    ["食事制限に対応できますか？","アレルギーやヴィーガン食は、お申し込み時にお知らせいただければ対応します。ハラールには対応しておりません。"],
    ["支払い方法は？","予約確定後にPayPalの支払いリンクをお送りします。3日以内にお支払いください。送料のみ当日現金払いです。"],
    ["ほかにも質問があります。","下のフォームで「質問のみ」を選んでお送りください。メールでお答えします。"]]},
  book:{h:"希望日をリクエスト",p:"1日1組、平日のみの受け入れです。ご希望の日程をお送りいただければ、3営業日以内にお返事します。",micro:"日程が確定するまで、お支払いは発生しません。",btn:"リクエストフォームを開く",after:"ご質問だけの場合も、同じフォームで「質問のみ」を選んでお送りください。"},

    priv:"リクエストフォームでお送りいただいた情報（お名前、メールアドレス、電話番号、日程、人数、食事制限、お子様の年齢・身長など）は、お問い合わせへの回答とツアーの実施のためだけに使用します。当日関わる工房と飲食店以外に提供することはなく、販売することもありません。情報の確認や削除をご希望の場合は、メールでご連絡ください。",

fr:{
  title:"Seto, verre et céramique : une journée privée avec des maîtres artisans | Balt Kobo",
  nav:[["#story","Le récit"],["#day","La journée"],["#artisans","Les artisans"],["#price","Tarif"],["#faq","FAQ"]],
  ctaShort:"Demander une date", ctaMain:"Demander votre date",
  hero:{kicker:"Journée privée de soufflage de verre et de céramique, à 40 minutes de Nagoya",
    h1:"De la mine d'argile<br>jusqu'à vos mains.",
    lead:"Passez une journée privée à Seto, ville de la céramique depuis mille ans, auprès de maîtres du verre et de l'argile qui vous accueillent dans leurs propres ateliers et vous enseignent en personne. Soufflez le verre, tournez l'argile, longez les mines d'où elle vient, puis partagez le dîner avec ceux qui vous ont appris. Vous repartez avec quatre pièces faites de vos mains.",
    facts:["66 000 ¥ par personne","Un seul groupe privé par jour, 2 à 4 personnes","En semaine, de 10 h à 19 h","Quatre pièces faites de vos mains"],
    micro:"Environ une minute. Rien à payer avant la confirmation de votre date.",
    rating:"Noté 5,0 sur un grand site international de réservation pour nos ateliers de verre et de céramique"},
  emp:{h:"La plupart des ateliers d'artisanat durent une heure, dans une salle remplie d'inconnus.",
    p:["On façonne vite, quelqu'un d'autre termine la pièce, et l'on ne rencontre jamais vraiment la personne qui a consacré sa vie à ce savoir-faire.",
       "Cette journée est tout l'inverse. Votre groupe est le seul. À chaque étape, le maître de cet art vous enseigne ou vous guide en personne, dans un atelier en activité, et le soir, tous vous rejoignent pour le dîner."]},
  story:{h:"La ville qui a donné son nom à la céramique",
    p:["Au Japon, la vaisselle du quotidien s'appelle encore <i>setomono</i> : « les choses de Seto ». Depuis plus de mille ans, sans interruption, cette ville fabrique de la céramique.", "Tout commence par l'argile. Bien avant que l'archipel japonais ne prenne sa forme actuelle, la région était une cuvette de lacs et de marais. Le granite s'y est déposé et, avec le temps, le fer s'en est échappé, laissant une argile blanche rare dans le monde. Elle permet à Seto de produire aussi bien de la poterie que de la porcelaine. Le même sol fournit du sable siliceux, et Seto fournirait environ 70 % du sable à verre extrait au Japon. Les mines d'argile se trouvent à une dizaine de minutes à pied de la gare d'Owari-Seto.", "La ville, jadis assez prospère pour construire son propre chemin de fer, voit aujourd'hui cette chaîne s'amenuiser. La coopérative céramique d'Aichi comptait autrefois plus de 1 000 entreprises membres ; il en reste environ 250. Certains estiment que l'argile exploitée aujourd'hui pourrait être épuisée d'ici 25 ans environ. Seto reste pourtant l'un des rares endroits où l'on peut voir toute la chaîne à l'œuvre, de l'extraction de l'argile à l'affinage, au façonnage, à la cuisson et à la vente. Une simple tasse passe entre les mains de nombreux spécialistes, mouleurs, fabricants d'émaux, peintres, fours et grossistes, si bien que toute la ville a fonctionné comme un seul grand atelier.", "Les artisans de cette journée partagent un même souhait : que des visiteurs du monde entier puissent voir ce savoir-faire tant qu'il est vivant, et en emporter un fragment."],
    eras:[["Fin de l'époque de Heian, il y a environ 1 000 ans", "On dit que les potiers d'ici commencèrent à émailler leurs pièces avec la cendre de pin rouge."], ["XVIe–XVIIe siècles", "La céramique prospère avec la cérémonie du thé ; à l'époque d'Edo, Seto produit pour les Tokugawa d'Owari, seigneurs du château de Nagoya."], ["Début du XIXe siècle", "Les potiers commencent à fabriquer de la porcelaine avec l'argile blanche locale."], ["Fin du XIXe et XXe siècle", "Tasses à café et figurines en porcelaine partent dans le monde entier. La deuxième génération de la famille du potier Masukichi Kawamoto fonde le chemin de fer électrique de Seto, l'actuelle ligne Meitetsu Seto. La céramique part en train jusqu'à Nagoya, puis en bateau sur la rivière Hori jusqu'au port de Nagoya, et de là vers tout le Japon et le monde. La ville prospère, et <i>setomono</i> devient le mot courant pour la vaisselle."], ["1982", "Dans une ville de potiers, avec ses fours, ses briques réfractaires et ses artisans prêts à conseiller, Balt Kobo ouvre ses portes : premier atelier de verre indépendant d'Aichi."]],
    land:"Le paysage minier de Seto. L'argile blanche et le sable siliceux de ces collines sont les matières premières de sa céramique et de son verre.",works:"Dans une usine de préparation d'argile : l'argile, purifiée par <i>suihi</i> (un lavage qui sépare les impuretés) puis pressée pour en retirer l'eau, sèche au soleil.",chain:["La mine","L'affinage","Le façonnage","La cuisson","Votre table"]},
  video:"La journée en images",
  expect:{h:"Au programme",items:[
    ["Mille ans en une conversation","Commencez avec le maître verrier {M} et l'histoire d'une ville de potiers devenue aussi ville du verre."],
    ["Créez deux pièces en verre","Verre, soliflore ou carillon en verre soufflé, ou pendentif façonné à la flamme, aux couleurs et motifs de votre choix."],
    ["Mines d'argile et manufacture","Apercevez depuis la route la zone d'extraction d'argile de Seto, puis observez la peinture à la main chez Chikudoen."],
    ["Un four grimpant encore debout","{Z}, huitième génération du four Seto Hongyo, vous fait découvrir le four et le musée Seto Mingei."],
    ["Tournez deux pièces","Au choix : tasse à thé, assiette, bol à riz ou petit bol."],
    ["Dîner avec les artisans","Cuisine locale de Seto, partagée avec les artisans rencontrés dans la journée."],
    ["Vos pièces, emballées et expédiées","Dans une boîte en paulownia portant la signature et le sceau des maîtres, avec un certificat."]]},
  why:{h:"Pourquoi cette journée",items:[
    ["Enseigné par les maîtres eux-mêmes","Plus de 45 ans de verre, plus de 50 ans au tour, et une famille de potiers à sa huitième génération."],
    ["Votre groupe uniquement","Un seul groupe privé par jour : ateliers, repas et trajets rien que pour vous."],
    ["Tout l'artisanat dans une seule ville","Mine, affinage, tour et four, à quelques minutes de route. Seule Seto réunit encore tout cela."],
    ["Les photos, on s'en occupe","Un membre de l'équipe photographie et filme votre journée, puis vous envoie tout par WhatsApp."],
    ["Noté 5,0 par nos visiteurs","Tous les avis laissés sur un grand site international de réservation pour nos ateliers de verre et de céramique sont, à ce jour, cinq étoiles."],
    ["Jamais une pièce cassée","Sur tous nos envois internationaux, aucune pièce n'est jamais arrivée cassée."],
    ["En famille dès 6 ans","Les enfants de moins de 6 ans peuvent vous accompagner gratuitement."]]},
  day:{h:"Votre journée, heure par heure",intro:"Tout est privatisé pour votre groupe. Un véhicule dédié assure les trajets, et la visite se déroule en anglais.",stops:[
    ["10:00","Rendez-vous à la gare d'Owari-Seto","Votre hôte vous accueille à la gare. Un membre de l'équipe vous accompagne toute la journée pour prendre photos et vidéos."],
    ["10:15","Rencontre avec le maître verrier","{M} travaille le verre depuis plus de 45 ans et a ouvert Balt Kobo en 1982, premier atelier de verre indépendant d'Aichi. Il vous explique pourquoi une ville de potiers est aussi devenue une ville du verre, en commençant par le sable sous vos pieds."],
    ["10:30","Créez deux pièces en verre","Accompagné individuellement devant le four et les chalumeaux de l'atelier, vous réalisez deux pièces : un verre à boire, un soliflore ou un carillon à vent en verre soufflé, ou un pendentif façonné à la flamme (<i>lampwork</i>). Vous choisissez vous-même couleurs et motifs : chaque pièce est unique. L'épouse du maître ou un autre membre de l'atelier vous assiste tout au long, après une consigne de sécurité.","glass.jpg","fire"],
    ["12:00","Déjeuner avec les artisans","Des yakisoba de Seto, préparés maison à l'atelier. Ces nouilles cuites à la vapeur, finies dans un bouillon de porc au soja, sont depuis longtemps le déjeuner rapide et nourrissant des artisans de Seto, et figurent parmi les « 100-Year Foods » de l'Agence japonaise des affaires culturelles."],
    ["13:00","Le long des mines d'argile, jusqu'à la manufacture","Avant de partir, votre guide vous présente en photos les lieux que vous allez traverser. Depuis la route principale, vous apercevez la zone d'extraction d'argile de Seto, puis vous visitez Chikudoen, une manufacture familiale fondée en 1912, pour voir les artisans peindre chaque pièce à la main.","chikudoen.jpg","clay"],
    ["14:00","Un four grimpant encore debout","{Z}, héritier de huitième génération du four Seto Hongyo, vous guide dans le musée Seto Mingei et devant un four grimpant (<i>noborigama</i>) toujours en place, parmi la vaisselle du quotidien admirée par Soetsu Yanagi et Bernard Leach.","kiln.jpg","clay"],
    ["15:00","Deux pièces au tour","À Tosui, un atelier-galerie paisible, {K}, potier depuis plus de 50 ans, vous guide pour tourner deux pièces : tasse à thé, assiette, bol à riz ou petit bol.","pottery.jpg","clay"],
    ["17:00","Un dîner d'exception avec les artisans","Les artistes et artisans rencontrés dans la journée vous rejoignent pour un dîner de cuisine traditionnelle de Seto. Le moment de poser les questions qu'on n'a pas pu poser à l'établi.","dinner.jpg","dusk"],
    ["19:00","Retour à la gare d'Owari-Seto","Votre hôte vous raccompagne à la gare, et la journée s'achève."]]},
  take:{h:"Ce que vous rapportez",intro:"Quatre pièces faites de vos mains, toutes uniques au monde.",
    gH:"Votre verre : deux pièces",gP:"Deux pièces au choix : pendentif (travail à la flamme), verre à boire, soliflore ou carillon (verre soufflé). Vous choisissez couleurs et motifs : personne d'autre au monde n'aura la même pièce.",g:["Pendentif sur cordon de cuir", "Verre à boire", "Soliflore", "Couleurs et motifs de votre choix"],bH:"Votre céramique : deux pièces, de l'argile à la boîte",
    ba:["L'argile de Seto, sortie de la mine","Façonnée au tour","Cuite, signée et mise en boîte"],
    items:[["Le jour même : votre pendentif en verre","Si vous choisissez un pendentif, il refroidit à temps pour repartir avec vous, monté sur un cordon de cuir."],
      ["Environ deux mois plus tard : tout le reste","La céramique doit sécher puis passer deux cuissons. Vos céramiques et vos autres pièces en verre sont ensuite placées dans une boîte en paulownia portant la signature et le sceau des maîtres, et ornée de calligraphies d'un calligraphe, avec un certificat, et expédiées par EMS."],
      ["Un emballage pensé pour le voyage","Chaque boîte est emballée à la main pour supporter le trajet. Sur tous nos envois internationaux, aucune pièce n'est jamais arrivée cassée."]],
    note:"L'expédition se règle en espèces (yens) le jour même et est facturée par carton, selon le poids et la destination. Toutes les pièces d'une personne tiennent dans une seule boîte en paulownia. Envoyée seule, elle forme un carton d'environ 5 kg, soit environ 9 000 à 18 000 ¥ par EMS. Les boîtes de deux personnes envoyées à la même adresse peuvent partager un carton ; pour trois ou quatre, deux cartons peuvent être nécessaires. Vous pouvez expédier vers autant d'adresses que vous le souhaitez."},
  people:{h:"Ceux qui vous transmettront leur art",intro:"Chaque étape est menée par le maître de cet art, et tous vous rejoignent pour le dîner.",team:"{M} (deuxième à gauche) et son épouse (à droite), qui assiste habituellement au soufflage du verre et prépare le déjeuner, avec des visiteurs à Balt Kobo.",list:[["M", "Maître verrier, fondateur de Balt Kobo", "Plus de 45 ans de verre", "Depuis l'ouverture de Balt Kobo à Seto en 1982, il crée et enseigne le verre depuis plus de 40 ans. Plus de 3 000 visiteurs par an apprennent auprès de lui le soufflage et le travail à la flamme, et son approche, laisser les visiteurs faire le plus possible de leurs propres mains, est particulièrement appréciée des voyageurs étrangers. À partir de 1988, il a étudié le verre pendant environ deux ans en Grande-Bretagne ; de retour, il a fondé un groupe d'étude et organisé expositions et événements pour faire naître une culture du verre à Seto. Témoin des débuts du verre d'art au Japon, il entretient des liens étroits avec les potiers et les fours de Seto. Votre hôte pour la journée, il fait le lien entre le verre et l'argile.", "lee.jpg"], ["K", "Potier, Tosui ; membre émérite de l'Association de céramique de Seto", "Plus de 50 ans au tour", "Sélectionné au Nitten en 1974, il a notamment reçu le deuxième prix de l'Exposition internationale de céramique Chunichi (1983), une médaille de bronze au Concours international de céramique de Mino (1989) et un prix d'or à l'Exposition d'artisanat d'Itami (1991), et a été invité au Concours international de céramique de Faenza, en Italie. Il crée et enseigne aujourd'hui dans son atelier, Tosui ; président de l'association des anciens élèves du lycée de céramique de Seto, fondé il y a 130 ans, il y enseigne aussi. Ses visiteurs le décrivent comme patient et encourageant, même avec des débutants complets.", "kamei.jpg"], ["Z", "Héritier de huitième génération, four Seto Hongyo", "Une famille de potiers depuis huit générations", "Né en 1979 au four Seto Hongyo, dont les chefs portent le nom de Hanjiro Mizuno, il s'est formé auprès de son père, le septième Hanjiro. Il a reçu deux fois le prix d'encouragement de l'exposition du Musée japonais des arts populaires (2013, 2017) et donne des conférences dans les musées d'artisanat de tout le Japon. En 2022, il a ouvert le musée Seto Mingei. Conteur de l'histoire de Seto, il vous guide dans le musée et devant le four grimpant.", "mizuno.jpg"]]},
  reviews:{h:"Ce qu'en disent nos visiteurs",intro:"Avis laissés sur un grand site international de réservation pour nos ateliers de soufflage de verre et de céramique. Cette journée complète est nouvelle et réunit les deux.",label:"Traduction",tr:["Une super expérience ! Rien que nous deux avec le maître et son équipe. L'envoi à notre hôtel suivant s'est parfaitement passé : les verres sont arrivés intacts. C'est incroyable tout ce qu'on nous a laissé faire nous-mêmes. Vraiment génial !","Une expérience merveilleuse : voir comment les habitants de Seto préservent et partagent leur tradition céramique. Ils ont expliqué l'histoire clairement et m'ont appris à créer différentes pièces au tour. Je recommande vivement à tous ceux qui s'intéressent à la céramique et à cet art magnifique !","Une très belle expérience de poterie. L'ambiance était détendue, et notre guide Yasu et le maître ont été formidables : patients, clairs et très encourageants. Ils ont rendu tout le processus facile et agréable, même pour des débutants. Nous recommandons vivement !","Nous avons adoré travailler vraiment au tour, guidés par un couple de maîtres potiers de Seto. Nos pièces nous ont tant plu que nous avons payé un supplément pour toutes les rapporter. Il faut attendre un à deux mois, mais ce n'est pas grave. Nous avons aussi pu acheter des œuvres originales des maîtres et visiter des boutiques et galeries qui les exposent. Une super expérience !"],

    rows:[["Taille du groupe","2 à 4 personnes, un seul groupe privé par jour (minimum 2)"],["Enfants","À partir de 6 ans, au même tarif que les adultes. Les enfants de moins de 6 ans ne peuvent pas participer mais peuvent vous accompagner gratuitement."],["Paiement","Par PayPal dans les 3 jours suivant la confirmation. L'expédition se règle en espèces le jour même."]],
    incH:"Compris",inc:["Création en verre avec un maître artisan : soufflage ou travail à la flamme (2 pièces)","Tournage avec un maître potier (2 pièces)","Vue sur la zone d'extraction d'argile et visite de la manufacture","Entrée au musée Seto Mingei et four grimpant","Déjeuner fait maison (yakisoba de Seto)","Dîner d'exception avec les artisans (cuisine locale)","Tous les trajets entre les étapes","Photos et vidéos de votre journée, envoyées par WhatsApp","Boîte en paulownia avec signature et sceau des maîtres, et certificat"],
    excH:"Non compris",exc:["Trajet jusqu'à la gare d'Owari-Seto et retour","Expédition internationale par EMS : facturée par carton, selon le poids et la destination. Les pièces d'une personne tiennent dans une seule boîte en paulownia ; envoyée seule, cela fait un carton d'environ 5 kg, soit environ 9 000 à 18 000 ¥. À régler en espèces le jour même","Achats personnels"]},
  offer:{h:"Offre de lancement",p:"Pour nos premiers groupes : un cadeau spécial de Seto. Contactez-nous pour en savoir plus."},
  worries:{h:"Vos hésitations, nos réponses",items:[
    ["Cela vaut-il le prix ?","Tout est compris : deux ateliers, quatre pièces, déjeuner, dîner, entrée au musée, trajets privés, photos et boîte en paulownia portant la signature et le sceau des maîtres."],
    ["Cela vaut-il une journée entière de mon voyage ?","Seto est à environ 40 minutes de la gare de Nagoya. Le programme est fixé et un véhicule privé vous conduit à chaque étape."],
    ["Je ne suis pas manuel. Mes pièces seront-elles réussies ?","Aucune expérience n'est nécessaire. Chaque maître vous guide individuellement et vous aide à finir chaque pièce."],
    ["Le soufflage du verre est-il sans danger ?","Vous recevez une consigne de sécurité, signez un formulaire de consentement, et la visite est assurée. Le maître reste à vos côtés devant le four."]]},

    ["Envoyez une demande","Environ une minute ; vous recevez aussitôt un e-mail de confirmation de réception."],
    ["Nous confirmons la disponibilité","Nous vérifions auprès de chaque atelier et répondons sous 3 jours ouvrés."],
    ["Paiement par PayPal","Une fois la date confirmée, nous envoyons un lien PayPal. Réglez sous 3 jours pour garantir votre date."],
    ["E-mail avant le départ","Une semaine avant, nous envoyons le point de rendez-vous et ce qu'il faut apporter."],
    ["Votre journée à Seto","Le jour même, nous restons en contact par WhatsApp et vous y envoyons vos photos et vidéos."],
    ["Votre colis arrive","Environ deux mois plus tard, vos pièces sont expédiées par EMS."]]},
  know:{h:"Bon à savoir",items:[
    "Rendez-vous à la gare d'Owari-Seto à 10 h. Fin au même endroit à 19 h.",
    "En semaine uniquement. Fermé les week-ends et les jours fériés japonais, dont la Golden Week (fin avril à début mai), ainsi qu'à Obon (mi-août) et pendant les fêtes du Nouvel An (fin décembre à début janvier).",
    "Les demandes sont closes 20 jours avant la date, à 18 h (heure du Japon).",
    "À partir de 6 ans. Les enfants doivent être assez grands pour travailler en sécurité devant le four : indiquez-nous leur âge et leur taille.",
    "Portez des chaussures fermées et des vêtements en fibres naturelles, comme le coton. Ils peuvent être tachés d'argile.",
    "La visite a lieu par tous les temps.",
    "Signalez allergies ou régime végan lors de la réservation. Nous ne pouvons pas proposer de repas halal.",
    "Pas de prise en charge à l'hôtel. Les trajets entre les étapes sont assurés pendant la visite."],
    cxH:"Conditions d'annulation",cx:[["15 jours ou plus avant","Gratuit"],["7 à 14 jours avant","20 %"],["2 à 6 jours avant","30 %"],["La veille","50 %"],["Le jour même","100 %"]]},
  bot:{"title": "Questions sur la journée", "hello": "Bonjour ! Touchez une question ci-dessous, je vous réponds tout de suite.", "extra": [["Combien cela coûte-t-il ?", "66 000 ¥ par personne, TTC, pour un groupe privé de 2 à 4 personnes. L'expédition de vos pièces par EMS est en supplément, à régler en espèces le jour même."], ["Quand la visite a-t-elle lieu ?", "En semaine uniquement, de 10 h à 19 h, un seul groupe par jour. Fermé les week-ends et les jours fériés japonais, dont la Golden Week (fin avril à début mai), ainsi qu'à Obon (mi-août) et pendant les fêtes du Nouvel An (fin décembre à début janvier). Les demandes sont closes 20 jours avant la date."]], "other": "J'ai une autre question", "otherA": "Envoyez-la via le formulaire en choisissant « Question uniquement ». Nous répondons par e-mail sous 3 jours ouvrés.", "book": "Aller au formulaire", "more": "Autre chose ?", "open": "Ouvrir le chat des questions", "close": "Fermer"},
  faq:{h:"Questions fréquentes",items:[
    ["Faut-il de l'expérience ?","Non. Chaque maître vous guide individuellement et vous aide à terminer vos pièces."],
    ["Le soufflage du verre est-il sans danger ?","L'atelier utilise le feu, du verre très chaud et des outils : vous recevez une consigne de sécurité et signez un formulaire de consentement avant de commencer, et la visite est assurée. Portez des chaussures fermées et des vêtements en fibres naturelles."],
    ["Les enfants peuvent-ils participer ?","Oui, dès 6 ans, s'ils sont assez grands pour travailler en sécurité devant le four, au même tarif que les adultes. Les moins de 6 ans peuvent vous accompagner gratuitement."],
    ["Combien coûte l'expédition ?","L'expédition est facturée par carton, selon le poids et la destination, et se règle en espèces le jour même. Toutes les pièces d'une personne tiennent dans une seule boîte en paulownia ; envoyée seule, elle forme un carton d'environ 5 kg, soit environ 9 000 à 18 000 ¥ par EMS. Deux boîtes pour une même adresse peuvent partager un carton ; pour trois ou quatre, deux cartons peuvent être nécessaires. Vous pouvez expédier vers autant d'adresses que vous le souhaitez."],
    ["Quand recevrai-je mes pièces ?","La céramique sèche et passe deux cuissons, ce qui prend environ deux mois ; votre boîte est ensuite expédiée par EMS. Un pendentif en verre repart avec vous le jour même."],
    ["Puis-je prendre des photos ?","Bien sûr. Un membre de l'équipe photographie et filme aussi toute votre journée, puis vous envoie tout par WhatsApp."],
    ["Et s'il pleut ?","La visite a lieu par tous les temps, et les trajets se font en véhicule privé."],
    ["Comment rejoindre la gare d'Owari-Seto ?","Depuis la gare de Sakaemachi, au centre de Nagoya, prenez la ligne Meitetsu Seto jusqu'à son terminus, Owari-Seto. Comptez environ 40 minutes depuis la gare de Nagoya. Cette ligne a d'abord été construite pour transporter la céramique de Seto."],
    ["Venez-vous nous chercher à l'hôtel ?","La prise en charge à l'hôtel n'est pas comprise. Un véhicule privé vous conduit entre toutes les étapes."],
    ["Pouvez-vous adapter les repas ?","Oui pour les allergies et le régime végan, si vous nous prévenez à la réservation. Nous ne pouvons pas proposer de repas halal."],
    ["Comment payer ?","Après confirmation de votre date, nous envoyons un lien de paiement PayPal, à régler sous 3 jours. Seule l'expédition se paie en espèces le jour même."],
    ["J'ai une autre question.","Utilisez le formulaire ci-dessous et choisissez « Question uniquement ». Nous vous répondrons par e-mail."]]},
  book:{h:"Demandez votre date",p:"Un seul groupe privé par jour, en semaine uniquement. Indiquez la date souhaitée : nous répondons sous 3 jours ouvrés.",micro:"Aucun paiement avant la confirmation de votre date.",btn:"Ouvrir le formulaire",after:"Simple question ? Utilisez le même formulaire et choisissez « Question uniquement »."},

de:{
  title:"Seto, Glas und Keramik: ein privater Tag mit Meisterhandwerkern | Balt Kobo",
  nav:[["#story","Geschichte"],["#day","Der Tag"],["#artisans","Die Meister"],["#price","Preis"],["#faq","FAQ"]],
  ctaShort:"Termin anfragen", ctaMain:"Wunschtermin anfragen",
  hero:{kicker:"Privater Tag mit Glasblasen und Töpfern, 40 Minuten von Nagoya",
    h1:"Von der Tongrube<br>in Ihre Hände.",
    lead:"Verbringen Sie einen privaten Tag in Seto, seit tausend Jahren eine Stadt der Keramik, bei Meistern für Glas und Ton, die Sie in ihren eigenen Werkstätten persönlich anleiten. Blasen Sie Glas, drehen Sie Ton auf der Scheibe, fahren Sie an den Gruben vorbei, aus denen der Ton kommt, und essen Sie am Abend mit den Menschen, die Sie angeleitet haben. Sie nehmen vier Stücke mit, die Sie selbst gemacht haben.",
    facts:["66.000 ¥ pro Person","Eine private Gruppe pro Tag, 2–4 Personen","Werktags, 10:00–19:00 Uhr","Vier Stücke aus Ihren eigenen Händen"],
    micro:"Dauert etwa eine Minute. Sie zahlen erst, wenn wir Ihren Termin bestätigt haben.",
    rating:"Bewertet mit 5,0 auf einer großen internationalen Buchungsplattform für unsere Glas- und Töpferkurse"},
  emp:{h:"Die meisten Handwerkskurse dauern eine Stunde, in einem Raum voller Fremder.",
    p:["Man formt schnell etwas, jemand anderes stellt es fertig, und den Menschen, der sein Leben diesem Handwerk gewidmet hat, lernt man nie wirklich kennen.",
       "Dieser Tag ist das Gegenteil. Ihre Gruppe ist die einzige. An jeder Station leitet oder führt Sie der Meister dieses Handwerks persönlich, in einer echten Werkstatt, und am Abend kommen alle zum gemeinsamen Essen zusammen."]},
  story:{h:"Die Stadt, die der Keramik ihren Namen gab",
    p:["In Japan heißt Alltagsgeschirr bis heute <i>setomono</i>, „Dinge aus Seto“. Seit mehr als tausend Jahren wird in dieser Stadt ohne Unterbrechung Keramik hergestellt.", "Alles beginnt mit dem Ton. Lange bevor Japan seine heutige Gestalt annahm, war diese Gegend ein Becken aus Seen und Sümpfen. Granit wurde hineingeschwemmt, und mit der Zeit wurde das Eisen ausgewaschen. Zurück blieb ein weißer Ton, der weltweit selten ist. Aus ihm lassen sich sowohl Töpferware als auch Porzellan herstellen. Derselbe Boden liefert Quarzsand für Glas; etwa 70 % des in Japan geförderten Glassands sollen aus Seto stammen. Die Tongruben liegen etwa zehn Gehminuten vom Bahnhof Owari-Seto entfernt.", "Die Stadt, einst so wohlhabend, dass sie eine eigene Eisenbahn baute, erlebt heute, wie diese Kette dünner wird. Der Keramikverband von Aichi zählte einst über 1.000 Mitgliedsbetriebe, heute sind es rund 250. Manche schätzen, dass der heute abgebaute Ton in etwa 25 Jahren erschöpft sein könnte. Und doch ist Seto einer der wenigen Orte, an denen sich die ganze Kette noch erleben lässt: vom Abbau des Tons über das Aufbereiten, Formen und Brennen bis zum Verkauf. Eine einzige Tasse geht durch die Hände vieler Spezialisten, von Formenbauern und Glasurherstellern bis zu Malern, Brennereien und Großhändlern, sodass die ganze Stadt wie eine große Werkstatt funktioniert hat.", "Die Handwerker dieses Tages verbindet ein Wunsch: dass Menschen aus aller Welt dieses Handwerk sehen, solange es lebt, und ein Stück davon mit nach Hause nehmen."],
    eras:[["Späte Heian-Zeit, vor etwa 1.000 Jahren", "Die Töpfer hier sollen begonnen haben, ihre Ware mit der Asche der Rotkiefer zu glasieren."], ["16.–17. Jahrhundert", "Mit der Teezeremonie blüht die Keramik auf; in der Edo-Zeit fertigt Seto Geschirr für die Owari-Tokugawa, die Herren der Burg Nagoya."], ["Frühes 19. Jahrhundert", "Aus dem heimischen weißen Ton wird erstmals Porzellan hergestellt."], ["Spätes 19. und 20. Jahrhundert", "Kaffeetassen und Porzellanfiguren gehen in alle Welt. Die zweite Generation der Familie des Töpfers Masukichi Kawamoto gründet die Elektrische Eisenbahn Seto, die heutige Meitetsu-Seto-Linie. Die Keramik reist per Bahn nach Nagoya, per Boot über den Hori-Fluss zum Hafen von Nagoya und von dort in ganz Japan und in die Welt. Die Stadt blüht auf, und <i>setomono</i> wird zum Alltagswort für Geschirr."], ["1982", "In einer Töpferstadt mit Brennöfen, Schamottsteinen und Handwerkern, die mit Rat helfen, entsteht Balt Kobo, die erste unabhängige Glaswerkstatt der Präfektur Aichi."]],
    land:"Setos Bergbaulandschaft. Der weiße Ton und der Quarzsand unter diesen Hügeln sind die Rohstoffe für Keramik und Glas.",works:"In einem Tonwerk: Der Ton wird durch <i>Suihi</i>, ein Schlämmverfahren, von Verunreinigungen befreit, in einer Presse entwässert und dann in der Sonne getrocknet.",chain:["Grube","Aufbereitung","Formen","Brennen","Ihr Tisch"]},
  video:"Der Tag im Film",
  expect:{h:"Was Sie erleben",items:[
    ["Tausend Jahre in einem Gespräch","Beginnen Sie mit Glasmeister {M} und der Geschichte, wie eine Töpferstadt zur Glasstadt wurde."],
    ["Zwei Glasstücke gestalten","Trinkglas, Blumenvase oder Windspiel aus geblasenem Glas oder ein über der Flamme geformter Anhänger, in Farben und Mustern Ihrer Wahl."],
    ["Tongruben und Manufaktur","Sehen Sie Setos Tonabbaugebiet von der Straße aus und schauen Sie bei Chikudoen der Handbemalung zu."],
    ["Ein erhaltener Kletterofen","{Z}, Erbe des Seto-Hongyo-Ofens in achter Generation, führt Sie zum Ofen und durch das Seto-Mingei-Museum."],
    ["Zwei Stücke auf der Scheibe","Zur Wahl: Teebecher, Teller, Reisschale oder kleine Schale."],
    ["Abendessen mit den Handwerkern","Regionale Küche aus Seto, gemeinsam mit den Menschen, die Sie an diesem Tag kennengelernt haben."],
    ["Ihre Stücke, verpackt und verschickt","In einer Paulownia-Box mit Signatur und Siegel der Meister, mit Zertifikat."]]},
  why:{h:"Warum dieser Tag",items:[
    ["Von den Meistern selbst angeleitet","Über 45 Jahre Glas, über 50 Jahre an der Töpferscheibe und eine Töpferfamilie in achter Generation."],
    ["Nur Ihre Gruppe","Eine private Gruppe pro Tag: Werkstätten, Mahlzeiten und Fahrten gehören ganz Ihnen."],
    ["Das ganze Handwerk in einer Stadt","Grube, Aufbereitung, Scheibe und Ofen, alles nur eine kurze Fahrt entfernt. Das gibt es nur noch in Seto."],
    ["Fotos übernehmen wir","Ein Teammitglied fotografiert und filmt Ihren Tag und schickt Ihnen alles per WhatsApp."],
    ["Von Gästen mit 5,0 bewertet","Alle bisherigen Bewertungen unserer Glas- und Töpferkurse auf einer großen internationalen Buchungsplattform haben fünf Sterne."],
    ["Noch nie etwas zerbrochen","Bei all unseren internationalen Sendungen ist noch kein einziges Stück zerbrochen angekommen."],
    ["Für Familien ab 6 Jahren","Kinder unter 6 Jahren dürfen kostenlos mitkommen."]]},
  day:{h:"Ihr Tag, Stunde für Stunde",intro:"Alles ist exklusiv für Ihre Gruppe. Ein eigenes Fahrzeug bringt Sie von Ort zu Ort, die Führung erfolgt auf Englisch.",stops:[
    ["10:00","Treffpunkt Bahnhof Owari-Seto","Ihr Gastgeber holt Sie am Bahnhof ab. Ein Teammitglied begleitet Sie den ganzen Tag und macht Fotos und Videos für Sie."],
    ["10:15","Gespräch mit dem Glasmeister","{M} arbeitet seit über 45 Jahren mit Glas und gründete Balt Kobo 1982 als erste unabhängige Glaswerkstatt der Präfektur Aichi. Er erzählt, warum eine Töpferstadt auch zur Glasstadt wurde, angefangen beim Sand unter Ihren Füßen."],
    ["10:30","Zwei Glasstücke gestalten","In Einzelbetreuung an Ofen und Brennern der Werkstatt fertigen Sie zwei Stücke: ein Trinkglas, eine Blumenvase oder ein Windspiel aus mundgeblasenem Glas oder einen Anhänger, der über der Flamme geformt wird (<i>Lampwork</i>). Farben und Muster wählen Sie selbst, jedes Stück ist ein Unikat. Die Frau des Meisters oder eine Mitarbeiterin der Werkstatt unterstützt Sie dabei; vorher gibt es eine Sicherheitseinweisung.","glass.jpg","fire"],
    ["12:00","Mittagessen mit den Handwerkern","Hausgemachte Seto-Yakisoba in der Werkstatt. Die gedämpften Nudeln, vollendet in einer Brühe aus Schweinefleisch und Sojasauce, sind seit Langem das schnelle, sättigende Mittagessen der Handwerker von Seto und wurden von Japans Kulturbehörde als „100-Year Food“ ausgezeichnet."],
    ["13:00","Vorbei an den Tongruben zur Manufaktur","Vor der Abfahrt zeigt Ihnen Ihr Guide anhand von Fotos die Orte auf Ihrer Route. Von der Hauptstraße aus sehen Sie Setos Tonabbaugebiet und besuchen dann Chikudoen, einen Familienbetrieb seit 1912, wo Handwerker jedes Stück von Hand bemalen.","chikudoen.jpg","clay"],
    ["14:00","Ein erhaltener Kletterofen","{Z}, Erbe des Seto-Hongyo-Ofens in achter Generation, führt Sie durch das Seto-Mingei-Museum und zu einem erhaltenen Kletterofen (<i>Noborigama</i>), umgeben von Alltagsgeschirr, das Soetsu Yanagi und Bernard Leach bewunderten.","kiln.jpg","clay"],
    ["15:00","Zwei Stücke auf der Töpferscheibe","In Tosui, einer ruhigen Galerie mit Werkstatt, leitet Sie {K}, seit über 50 Jahren an der Töpferscheibe, beim Drehen von zwei Stücken an: Teebecher, Teller, Reisschale oder kleine Schale.","pottery.jpg","clay"],
    ["17:00","Ein besonderes Abendessen mit den Handwerkern","Die Künstler und Handwerker des Tages begleiten Sie zu einem besonderen Abendessen mit traditioneller Küche aus Seto. Zeit für die Fragen, die an der Werkbank keinen Platz hatten.","dinner.jpg","dusk"],
    ["19:00","Zurück am Bahnhof Owari-Seto","Ihr Gastgeber bringt Sie zurück zum Bahnhof, und der Tag geht zu Ende."]]},
  take:{h:"Was Sie mitnehmen",intro:"Vier Stücke aus Ihren eigenen Händen, jedes ein Unikat.",
    gH:"Ihr Glas: zwei Stücke",gP:"Zwei Stücke nach Wahl: Anhänger (Lampwork), Trinkglas, Blumenvase oder Windspiel (geblasen). Farben und Muster bestimmen Sie selbst, niemand sonst auf der Welt hat dasselbe Stück.",g:["Anhänger am Lederband", "Trinkglas", "Blumenvase", "Farben und Muster nach Wahl"],bH:"Ihre Keramik: zwei Stücke, vom Ton bis zur Box",
    ba:["Ton aus Seto, frisch aus der Grube","Auf der Scheibe geformt","Gebrannt, signiert und verpackt"],
    items:[["Am selben Tag: Ihr Glasanhänger","Wenn Sie einen Anhänger wählen, kühlt er rechtzeitig ab und geht an einem Lederband mit Ihnen nach Hause."],
      ["Etwa zwei Monate später: alles andere","Keramik muss trocknen und zweimal gebrannt werden. Danach werden Ihre Keramik und Ihre übrigen Glasstücke in einer Paulownia-Box mit Signatur und Siegel der Meister, verziert mit der Pinselschrift eines Kalligrafen, mit Zertifikat verpackt und per EMS verschickt."],
      ["Für die Reise verpackt","Jede Box wird von Hand verpackt, damit sie die Reise übersteht. Bei all unseren internationalen Sendungen ist noch kein einziges Stück zerbrochen angekommen."]],
    note:"Der Versand wird am Tourtag bar (in Yen) bezahlt und pro Karton nach Gewicht und Ziel berechnet. Alle Stücke einer Person passen in eine einzige Paulownia-Box. Einzeln verschickt ergibt sie einen Karton von etwa 5 kg; per EMS kostet das etwa 9.000–18.000 ¥. Die Boxen von zwei Personen an dieselbe Adresse passen in einen Karton; bei drei oder vier können zwei Kartons nötig sein. Sie können an beliebig viele Adressen versenden."},
  people:{h:"Die Menschen, die Sie anleiten",intro:"Jede Station wird vom Meister dieses Handwerks geleitet, und am Abend kommen alle zum gemeinsamen Essen.",team:"{M} (Zweiter von links) und seine Frau (rechts), die normalerweise beim Glasblasen hilft und das Mittagessen kocht, mit Gästen bei Balt Kobo.",list:[["M", "Glaskünstler, Gründer von Balt Kobo", "Über 45 Jahre Glas", "Seit er 1982 in Seto Balt Kobo eröffnete, gestaltet und unterrichtet er seit über 40 Jahren Glas. Mehr als 3.000 Besucher im Jahr lernen bei ihm Glasblasen und Lampwork, und sein Ansatz, die Gäste möglichst viel mit eigenen Händen machen zu lassen, kommt besonders bei Reisenden aus dem Ausland gut an. Ab 1988 studierte er rund zwei Jahre lang Glas in Großbritannien; zurück in Seto gründete er einen Arbeitskreis und organisierte Ausstellungen und Veranstaltungen, um in der Stadt eine Glaskultur zu säen. Er hat die Anfänge der Studioglaskunst in Japan miterlebt und ist eng mit Setos Töpfern und Brennöfen verbunden. Als Ihr Gastgeber für den Tag verbindet er die Welten von Glas und Ton.", "lee.jpg"], ["K", "Keramiker, Tosui; Ehrenmitglied der Keramikvereinigung Seto", "Über 50 Jahre an der Töpferscheibe", "1974 wurde er zur Nitten-Ausstellung zugelassen. Zu seinen Auszeichnungen zählen der zweite Preis der Internationalen Keramikausstellung Chunichi (1983), Bronze beim Internationalen Keramikwettbewerb Mino (1989) und Gold bei der Itami Craft Exhibition (1991); außerdem wurde er zum Internationalen Keramikwettbewerb in Faenza, Italien, eingeladen. Heute arbeitet und unterrichtet er in seiner Werkstatt Tosui und lehrt als Vorsitzender des Ehemaligenvereins der 130 Jahre alten Keramikschule von Seto auch deren Schüler. Gäste beschreiben ihn als geduldig und ermutigend, selbst bei völligen Anfängern.", "kamei.jpg"], ["Z", "Erbe in achter Generation, Seto-Hongyo-Ofen", "Eine Töpferfamilie seit acht Generationen", "1979 in den Seto-Hongyo-Ofen hineingeboren, dessen Oberhäupter den Namen Hanjiro Mizuno tragen, lernte er bei seinem Vater, dem siebten Hanjiro. Zweimal erhielt er den Förderpreis der Ausstellung des Japanischen Volkskunstmuseums (2013, 2017) und hält Vorträge in Volkskunstmuseen in ganz Japan. 2022 eröffnete er das Seto-Mingei-Museum. Als Erzähler der Geschichte Setos führt er Sie durch das Museum und zum Kletterofen.", "mizuno.jpg"]]},
  reviews:{h:"Was Gäste sagen",intro:"Bewertungen unserer Glasblas- und Töpferkurse von einer großen internationalen Buchungsplattform. Diese Ganztagestour ist neu und vereint beides.",label:"Übersetzung",tr:["Es war ein tolles Erlebnis! Nur wir zwei mit dem Meister und seinem Team. Auch der Versand zu unserem nächsten Hotel hat perfekt geklappt, die Gläser kamen heil an. Erstaunlich, wie viel wir selbst machen durften. Wirklich toll!","Es war eine wunderbare Erfahrung zu sehen, wie die Menschen in Seto ihre Töpfertradition bewahren und weitergeben. Sie haben die Geschichte klar erklärt und mir gezeigt, wie man verschiedene Stücke auf der Scheibe formt. Sehr zu empfehlen für alle, die sich für Keramik und diese wunderschöne Kunstform interessieren!","Wir hatten ein wirklich schönes Töpfererlebnis. Die Atmosphäre war entspannt, und unser Guide Yasu und der Meister waren fantastisch: geduldig, verständlich und sehr ermutigend. Sie haben den ganzen Ablauf einfach und angenehm gemacht, selbst für Anfänger. Absolute Empfehlung!","Wir haben es geliebt, selbst an der Töpferscheibe zu arbeiten, angeleitet von einem Meisterpaar in Seto. Unsere Stücke gefielen uns so gut, dass wir extra bezahlt haben, um alle mitzunehmen. Wir müssen ein bis zwei Monate warten, aber das ist okay. Außerdem konnten wir Originalwerke der Meister kaufen und Läden und Galerien besuchen, in denen sie ausgestellt sind. Alles in allem ein tolles Erlebnis!"],
    glass:"Bewertungen zum Glasblasen lesen",pottery:"Bewertungen zum Töpfern lesen"},
  price:{h:"Preis",amount:"66.000 ¥",per:"pro Person, inkl. Steuer",
    rows:[["Gruppengröße","2–4 Personen, eine private Gruppe pro Tag (mindestens 2)"],["Kinder","Ab 6 Jahren, zum gleichen Preis wie Erwachsene. Kinder unter 6 Jahren können nicht teilnehmen, dürfen aber kostenlos mitkommen."],["Zahlung","Per PayPal innerhalb von 3 Tagen nach der Bestätigung. Der Versand wird am Tourtag bar bezahlt."]],
    incH:"Inklusive",inc:["Glasgestaltung mit einem Meister: Glasblasen oder Lampwork (2 Stücke)","Töpfern an der Scheibe mit einem Meister (2 Stücke)","Blick auf das Tonabbaugebiet und Besuch der Manufaktur","Eintritt Seto-Mingei-Museum und Kletterofen","Hausgemachtes Mittagessen (Seto-Yakisoba)","Besonderes Abendessen mit den Handwerkern (regionale Küche)","Alle Fahrten zwischen den Stationen","Fotos und Videos Ihres Tages, per WhatsApp","Paulownia-Box mit Signatur und Siegel der Meister, mit Zertifikat"],
    excH:"Nicht inklusive",exc:["An- und Abreise zum Bahnhof Owari-Seto","Internationaler Versand per EMS: pro Karton nach Gewicht und Ziel berechnet. Die Stücke einer Person passen in eine einzige Paulownia-Box; einzeln verschickt ergibt das einen Karton von etwa 5 kg, etwa 9.000–18.000 ¥. Bar am Tourtag zu zahlen","Persönliche Einkäufe"]},
  offer:{h:"Eröffnungsangebot",p:"Für unsere ersten Gruppen: ein besonderes Geschenk aus Seto. Fragen Sie uns nach Details."},
  worries:{h:"Ihre Bedenken, unsere Antworten",items:[
    ["Ist es den Preis wert?","Alles ist inklusive: zwei Werkstätten, vier Stücke, Mittag- und Abendessen, Museumseintritt, private Fahrten, Fotos und eine Paulownia-Box mit Signatur und Siegel der Meister."],
    ["Lohnt sich ein ganzer Reisetag?","Seto liegt etwa 40 Minuten vom Bahnhof Nagoya. Der Ablauf steht fest, und ein privates Fahrzeug bringt Sie zu jeder Station."],
    ["Ich bin nicht handwerklich begabt. Werden meine Stücke gelingen?","Vorkenntnisse sind nicht nötig. Jeder Meister leitet Sie einzeln an und hilft Ihnen, jedes Stück richtig fertigzustellen."],
    ["Ist Glasblasen sicher?","Sie erhalten eine Sicherheitseinweisung, unterschreiben eine Einverständniserklärung, und die Tour ist versichert. Der Meister bleibt am Ofen an Ihrer Seite."]]},
  steps:{h:"Von der Anfrage bis zu Ihrer Haustür",items:[
    ["Anfrage senden","Dauert etwa eine Minute; Sie erhalten sofort eine Eingangsbestätigung per E-Mail."],

const SKY = {
  "10:00":["#CFE0E3","#2E2B28",12,38,"#F6EBC8","rgba(246,235,200,.6)"],
  "10:15":["#D3E2E2","#2E2B28",18,46,"#F6EBC8","rgba(246,235,200,.6)"],
  "10:30":["#D8E3DE","#2E2B28",25,54,"#F5E6B8","rgba(245,230,184,.6)"],
  "12:00":["#E6E4D2","#2E2B28",45,66,"#F7E3A4","rgba(247,227,164,.65)"],
  "13:00":["#E7DDBE","#2E2B28",55,64,"#F4D98E","rgba(244,217,142,.65)"],
  "14:00":["#E5D1A6","#2E2B28",64,58,"#F0CB78","rgba(240,203,120,.65)"],
  "15:00":["#DDB98A","#2E2B28",72,50,"#ECB15E","rgba(236,177,94,.65)"],
  "17:00":["#9D5E4A","#F4EDE6",85,33,"#E9864B","rgba(233,134,75,.7)"],
  "19:00":["#2C3448","#E9ECF2",22,62,"#E8E6DA","rgba(232,230,218,.35)"]
};
let skyIO;
function initSky(){
  const sky = $(".sky"), clock = sky.querySelector(".clock"), now = sky.querySelector(".now");
  const set = stop => {
    const t = stop.dataset.time, s = SKY[t];
    document.querySelectorAll(".stop").forEach(x => x.classList.toggle("is-active", x === stop));
    clock.textContent = t; now.textContent = stop.querySelector("h3").textContent;
    [["--sky",s[0]],["--sky-ink",s[1]],["--ox",s[2]+"%"],["--oy",s[3]+"%"],["--orb",s[4]],["--orb-glow",s[5]]].forEach(([k,v])=>sky.style.setProperty(k,v));
  };
  if (skyIO) skyIO.disconnect();
  skyIO = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && set(e.target)), {rootMargin:"-45% 0px -50% 0px"});
  const stops = document.querySelectorAll(".stop");
  stops.forEach(s => skyIO.observe(s));
  set(stops[0]);
}

/* スマホ下部の予約ボタン */
let mIO;
function watchMbar(){
  const bar = $(".mbar"), vis = new Set();
  if (mIO) mIO.disconnect();
  mIO = new IntersectionObserver(es => { es.forEach(e => e.isIntersecting ? vis.add(e.target) : vis.delete(e.target)); bar.classList.toggle("hide", vis.size > 0); });
  mIO.observe($("#hero")); mIO.observe($("#book"));
}


/* ============================================================
   よくある質問チャットボット（FAQの内容から自動で作成）
   ============================================================ */
const BOT = (() => {
  const box = $("#bot"), log = box.querySelector(".bot-log"), chips = box.querySelector(".bot-chips"), btn = $(".bot-btn");
  const esc = t => t;
  const qa = () => { const d = C[L]; return d.bot.extra.concat(d.faq.items.slice(0, -1)); };
  const say = (t, who) => { const m = document.createElement("div"); m.className = "msg " + who; m.innerHTML = t; log.appendChild(m); log.scrollTop = log.scrollHeight; return m; };
  const drawChips = () => {
    const d = C[L].bot;
    chips.innerHTML = "";
    qa().forEach(([q, a]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = q; b.onclick = () => { const u = say(q, "u"); say(f(a), "b"); log.scrollTop = u.offsetTop - 12; }; chips.appendChild(b); });
    const o = document.createElement("button"); o.type = "button"; o.className = "alt"; o.textContent = d.other;
    o.onclick = () => { const u = say(d.other, "u"); const m = say(d.otherA, "b"); const a = document.createElement("a"); a.className = "btn"; a.href = formHref(); if (CONFIG.FORM_URL) { a.target = "_blank"; a.rel = "noopener"; } a.textContent = d.book; a.onclick = () => close(); m.appendChild(document.createElement("br")); m.appendChild(a); log.scrollTop = u.offsetTop - 12; };
    chips.appendChild(o);
  };
  const reset = () => {
    const d = C[L].bot;
    box.querySelector(".bot-title").textContent = d.title;
    box.setAttribute("aria-label", d.title);
    box.querySelector(".bot-x").setAttribute("aria-label", d.close);
    btn.setAttribute("aria-label", d.open);
    log.innerHTML = ""; say(d.hello, "b"); drawChips();
  };
  const open = () => { box.hidden = false; btn.setAttribute("aria-expanded", "true"); };
  const close = () => { box.hidden = true; btn.setAttribute("aria-expanded", "false"); btn.focus(); };
  btn.onclick = () => box.hidden ? open() : close();
  box.querySelector(".bot-x").onclick = close;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !box.hidden) close(); });
  return { reset };
})();
document.querySelectorAll(".langs button").forEach(x => x.addEventListener("click", () => { L = x.dataset.lang; render(); }));
(function(){
  const q = new URLSearchParams(location.search).get("lang");
  let s = null; try{ s = localStorage.getItem("seto_lang"); }catch(e){}
  const nav = (navigator.language || "en").slice(0,2).toLowerCase();
  L = [q, s, nav].find(x => SUPPORTED.includes(x)) || "en";
  render();
  BOT.reset();
})();
</script>
